name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      cassandra:
        image: cassandra:5.0
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x gradlew scripts/exercise-plugin.sh

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Install cqlsh
        run: pip install cqlsh

      - name: Wait for Cassandra
        run: |
          for i in $(seq 1 30); do
            cqlsh 127.0.0.1 9042 -e "DESCRIBE KEYSPACES" && break
            echo "Waiting for Cassandra ($i/30)..."; sleep 5
          done

      - name: Build and run unit tests
        run: ./gradlew build --console=plain

      - name: Functional smoke test (JAR)
        run: ./scripts/exercise-plugin.sh
        env:
          CASSANDRA_HOST: 127.0.0.1

      - name: Compile native image
        run: ./gradlew nativeCompile --console=plain

      - name: Functional smoke test (native binary)
        run: ./scripts/exercise-plugin.sh --binary
        env:
          CASSANDRA_HOST: 127.0.0.1

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: tabularis-cassandra-plugin-linux-x64
          path: build/native/nativeCompile/tabularis-cassandra-plugin
